spring.application.name=lam-tool-tiktok
server.address=127.0.0.1
server.port=${PORT:8080}
server.error.include-message=never
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
spring.datasource.url=jdbc:h2:file:${APP_DATA_DIR:./data}/jobs;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${APP_DB_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB

app.data-dir=${APP_DATA_DIR:./data}
app.ffmpeg=${FFMPEG_PATH:./tools/ffmpeg.exe}
app.ffprobe=${FFPROBE_PATH:./tools/ffprobe.exe}
app.yt-dlp=${YT_DLP_PATH:./tools/yt-dlp.exe}
app.max-input-bytes=104857600
app.max-duration-seconds=180
app.max-segments=60
app.max-speech-speed=2.50
app.ai-provider=${AI_PROVIDER:local}
app.whisper=${WHISPER_PATH:./tools/whisper/whisper-cli.exe}
app.whisper-model=${WHISPER_MODEL_PATH:./tools/whisper/ggml-base.bin}
app.piper=${PIPER_PATH:./tools/piper/piper.exe}
app.piper-model=${PIPER_MODEL_PATH:./tools/piper/vi_VN-vivos-x_low.onnx}
app.ollama-url=${OLLAMA_URL:http://127.0.0.1:11434/api/chat}
app.ollama-model=${OLLAMA_MODEL:qwen3:1.7b}
app.openai-api-key=${OPENAI_API_KEY:}
app.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.transcription-model=${TRANSCRIPTION_MODEL:whisper-1}
app.translation-model=${TRANSLATION_MODEL:gpt-4.1-mini}
app.tts-model=${TTS_MODEL:gpt-4o-mini-tts}
app.tts-voice=${TTS_VOICE:coral}

app.tiktok-client-key=${TIKTOK_CLIENT_KEY:}
app.tiktok-client-secret=${TIKTOK_CLIENT_SECRET:}
app.tiktok-redirect-uri=${TIKTOK_REDIRECT_URI:}
app.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}
